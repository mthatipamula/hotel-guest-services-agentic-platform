server:
  port: ${PORT:8080}
spring:
  application:
    name: guest-ops-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/guestops}
    username: ${DB_USER:guestops}
    password: ${DB_PASSWORD:guestops}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  flyway:
    enabled: true
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID}
          location: ${GCP_LOCATION:us-central1}
          chat:
            options:
              model: ${GEMINI_MODEL:gemini-2.5-flash}
              temperature: 0.2
guestops:
  service-name: guest-ops-orchestrator
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  network-zone: core
  auth:
    mode: ${SERVICE_AUTH_MODE:SHARED_TOKEN}
    shared-token: ${SERVICE_SHARED_TOKEN:local-dev-token-change-me}
  registry:
    url: ${REGISTRY_URL:http://localhost:8090}
    self-register: true
  models:
    fast: ${FAST_MODEL:gemini-2.5-flash-lite}
    standard: ${GEMINI_MODEL:gemini-2.5-flash}
    judge: ${JUDGE_MODEL:gemini-2.5-pro}
  mcp:
    server-id: hotel-mcp-server
    fallback-url: ${MCP_FALLBACK_URL:}
  orchestrator:
    max-agents-per-request: 4
    request-token-budget: 60000
    agent-timeout-seconds: 90
    history-turns: 6
    llm-safety-check: true
  # USD per 1M tokens, used only for cost estimates in the token dashboard.
  # List prices at the time of writing; check the Vertex AI pricing page and update.
  pricing:
    # Brackets keep the dots in model names from being read as nested keys.
    "[gemini-2.5-flash-lite]": {input: 0.10, output: 0.40}
    "[gemini-2.5-flash]": {input: 0.30, output: 2.50}
    "[gemini-2.5-pro]": {input: 1.25, output: 10.00}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
